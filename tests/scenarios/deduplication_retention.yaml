- out:
    path: /bottest/setWebhook
    body: {url: https://example.test/tg}
    response: {body: {ok: true, result: true}}
- in:
    path: /healthz
    response: {status: 204}
- in:
    path: /mail
    body: "Message-ID: <retention@example.test>\r\nContent-Type: text/plain\r\n\r\nOK"
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: InReach hike started.}
      disable_notification: true
      reply_markup:
        keyboard: [[{text: OK}, {text: FINISHED}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 1, date: 1700000000, chat: {id: 10, type: private}, text: sent}}
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: OK received.}
      disable_notification: true
      reply_markup:
        keyboard: [[{text: OK}, {text: FINISHED}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 2, date: 1700000000, chat: {id: 10, type: private}, text: sent}}
- in:
    path: /mail
    body: "Message-ID: <retention-finish@example.test>\r\nContent-Type: text/plain\r\n\r\nFINISHED"
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: InReach hike finished.}
      disable_notification: true
      reply_markup:
        keyboard: [[{text: Start hike}, {text: Settings}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 3, date: 1700000000, chat: {id: 10, type: private}, text: sent}}
- wait: 5d
- in:
    path: /mail
    body: "Message-ID: <retention@example.test>\r\nContent-Type: text/plain\r\n\r\nOK"
- crash: true
- wait: "2d 1s"
- restart: true
- out:
    path: /bottest/setWebhook
