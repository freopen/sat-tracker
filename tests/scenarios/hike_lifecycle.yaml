- out:
    path: /bottest/setWebhook
    body: {url: https://example.test/tg}
    response: {body: {ok: true, result: true}}
- in:
    path: /healthz
    response: {status: 204}
- in:
    path: /mail
    body: "Message-ID: <start@example.test>\r\nContent-Type: text/plain\r\n\r\nOK"
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: InReach hike started.}
      disable_notification: true
      reply_markup:
        keyboard: [[{text: OK}, {text: FINISHED}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 1, date: 1700000000, chat: {id: 10, type: private}, text: sent}}
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: OK received.}
      disable_notification: true
      reply_markup:
        keyboard: [[{text: OK}, {text: FINISHED}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 2, date: 1700000000, chat: {id: 10, type: private}, text: sent}}
- wait: 30m
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: No InReach OK for 30 minutes.}
      reply_markup:
        keyboard: [[{text: OK}, {text: FINISHED}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 3, date: 1700001800, chat: {id: 10, type: private}, text: sent}}
- wait: 30m
- out:
    path: /bottest/sendMessage
    body:
      chat_id: 20
      text: |-
        *SAFETY ALERT:* No OK has been received since ![2023\-11\-14T22:13:20\+00:00](tg://time?unix=1700000000&format=r)\.

        _Here are details to help locate the hiker\._

        •   *Hike started:* ![2023\-11\-14T22:13:20\+00:00](tg://time?unix=1700000000&format=d) at ![2023\-11\-14T22:13:20\+00:00](tg://time?unix=1700000000&format=t)
        •   *Starting location:* not recorded
        •   *Most recent event:* ![2023\-11\-14T22:13:20\+00:00](tg://time?unix=1700000000&format=r)
        •   *Last OK:* ![2023\-11\-14T22:13:20\+00:00](tg://time?unix=1700000000&format=r)
        •   *Last known location:* not recorded

        _Contact the hiker and use the locations above to decide what to do next\._
      parse_mode: MarkdownV2
    response:
      body: {ok: true, result: {message_id: 4, date: 1700003600, chat: {id: 20, type: private}, text: sent}}
- wait: 1m
- in:
    path: /mail
    body: "Message-ID: <recovery@example.test>\r\nContent-Type: text/plain\r\n\r\nOK"
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: OK received.}
      disable_notification: true
      reply_markup:
        keyboard: [[{text: OK}, {text: FINISHED}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 5, date: 1700003660, chat: {id: 10, type: private}, text: sent}}
- out:
    path: /bottest/sendMessage
    body:
      chat_id: 20
      text: |-
        *SAFETY CONTACT RESUMED:* The hike continues normally\.
      parse_mode: MarkdownV2
    response:
      body: {ok: true, result: {message_id: 7, date: 1700003660, chat: {id: 20, type: private}, text: sent}}
- wait: 10s
- in:
    path: /mail
    body: "Message-ID: <finish@example.test>\r\nContent-Type: text/plain\r\n\r\nFINISHED"
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: InReach hike finished.}
      disable_notification: true
      reply_markup:
        keyboard: [[{text: Start hike}, {text: Settings}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 8, date: 1700003670, chat: {id: 10, type: private}, text: sent}}
- in:
    path: /mail
    body: "Message-ID: <ignored-finished@example.test>\r\nContent-Type: text/plain\r\n\r\nFINISHED"
