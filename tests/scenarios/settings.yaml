- out:
    path: /bottest/setWebhook
    body: {url: https://example.test/tg}
    response: {body: {ok: true, result: true}}
- in:
    path: /healthz
    response: {status: 204}
- in:
    path: /tg
    body:
      update_id: 1
      message:
        message_id: 1
        date: 1700000000
        chat: {id: 10, type: private}
        text: Settings
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message: {markdown: Choose a setting.}
      disable_notification: true
      reply_markup:
        keyboard:
          - [{text: Owner reminder times}]
          - [{text: Safety reminder times}]
          - [{text: Safety alert template}]
          - [{text: Safety recovery template}]
          - [{text: Back}]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 1, date: 1700000000, chat: {id: 10, type: private}, text: sent}}
- in:
    path: /tg
    body:
      update_id: 2
      message:
        message_id: 2
        date: 1700000000
        chat: {id: 10, type: private}
        text: Owner reminder times
- out:
    path: /bottest/sendRichMessage
    body:
      chat_id: 10
      rich_message:
        markdown: "Owner reminder times are currently 30.\nType a new comma-separated list of positive, strictly increasing minutes (for example, 30, 45, 60)."
      disable_notification: true
      reply_markup:
        keyboard: [[{text: Back}]]
        is_persistent: true
        resize_keyboard: true
    response:
      body: {ok: true, result: {message_id: 2, date: 1700000000, chat: {id: 10, type: private}, text: sent}}
